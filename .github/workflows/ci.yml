name: CI

on:
  pull_request:
    branches:
      - ts
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check-types:
    name: check-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/zod-types --filter @repo/trpc build
      - run: pnpm check-types

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://metamcp_ci:metamcp_ci@localhost:5432/metamcp_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metamcp_ci
          POSTGRES_PASSWORD: metamcp_ci
          POSTGRES_DB: metamcp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metamcp_ci -d metamcp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/zod-types --filter @repo/trpc build
      - run: pnpm --filter backend test

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --file Dockerfile --tag metamcp:ci .
      - name: Build development image
        run: docker build --file Dockerfile.dev --tag metamcp-dev:ci .
      - name: Build devcontainer image
        run: docker build --file .devcontainer/Dockerfile --tag metamcp-devcontainer:ci .
